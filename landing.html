<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Character Sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=MedievalSharp&family=Cinzel:wght@400;600;700&family=Cinzel+Decorative:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#151016;
    --panel:#221a1f;
    --panel-2:#2c2027;
    --parchment:#ecdcb8;
    --gold:#c9a24b;
    --gold-dim:#8a6f33;
    --cosy-pink:#b95f7a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:40px 16px;
    min-height:100vh;
    background:
      radial-gradient(ellipse at 30% 0%, #2a2030 0%, transparent 55%),
      radial-gradient(ellipse at 80% 100%, #1a1620 0%, transparent 55%),
      var(--bg-deep);
    display:flex; flex-direction:column; align-items:center; gap:30px;
    font-family:'MedievalSharp', cursive;
  }

  .card{
    width:100%; max-width:640px;
    background: linear-gradient(160deg, var(--panel), var(--panel-2));
    border:2px solid var(--gold-dim);
    border-radius:10px;
    box-shadow:
      0 0 0 1px rgba(201,162,75,0.3) inset,
      0 20px 45px rgba(0,0,0,0.6);
    padding:34px 34px 30px;
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:"";
    position:absolute; inset:0;
    background:
      repeating-linear-gradient(45deg, rgba(255,255,255,0.015) 0 2px, transparent 2px 6px);
    pointer-events:none;
  }
  .corner-rune{
    position:absolute; width:34px; height:34px;
    opacity:0.55;
  }
  .corner-rune.tl{top:10px; left:10px;}
  .corner-rune.tr{top:10px; right:10px; transform:scaleX(-1);}
  .corner-rune.bl{bottom:10px; left:10px; transform:scaleY(-1);}
  .corner-rune.br{bottom:10px; right:10px; transform:scale(-1,-1);}

  .sheet-header{
    text-align:center; margin-bottom:22px; position:relative; z-index:1;
  }
  .sheet-label{
    font-family:'Cinzel Decorative', serif;
    font-size:0.78rem; letter-spacing:4px; text-transform:uppercase;
    color:var(--gold); margin-bottom:6px;
  }
  .char-name{
    font-family:'UnifrakturMaguntia', cursive;
    font-size:2.5rem; color:var(--parchment);
    text-shadow:0 2px 6px rgba(0,0,0,0.6);
    margin:0;
  }
  .char-name .fill{
    color:#8a7a5a; font-style:italic;
  }

  .stat-grid{
    display:grid;
    grid-template-columns:130px 1fr;
    row-gap:16px; column-gap:16px;
    position:relative; z-index:1;
    margin-top:20px;
  }
  .stat-key{
    font-family:'Cinzel', serif;
    font-weight:600; letter-spacing:1px;
    color:var(--gold);
    text-transform:uppercase;
    font-size:0.82rem;
    display:flex; align-items:center; gap:8px;
  }
  .stat-val{
    color:var(--parchment);
    font-size:1.05rem;
    line-height:1.5;
    align-self:center;
  }
  .stat-val .fill{ color:#8a7a5a; font-style:italic; }
  .stat-row-divider{
    grid-column:1 / -1;
    height:1px;
    background:linear-gradient(to right, transparent, var(--gold-dim), transparent);
    margin: 2px 0;
  }

  .badge{
    display:inline-block;
    padding:2px 10px;
    border:1px solid var(--gold-dim);
    border-radius:20px;
    font-family:'Cinzel', serif;
    font-size:0.8rem;
    color:var(--parchment);
  }
  .badge.cosy{ border-color:var(--cosy-pink); color:var(--cosy-pink); }
  .badge.love{
    border-color:#ff3d78;
    color:#ff3d78;
    background:rgba(255,61,120,0.1);
    text-shadow:0 0 8px rgba(255,61,120,0.6);
    box-shadow:0 0 10px rgba(255,61,120,0.35);
  }

  .enter-row{
    margin-top:12px;
    text-align:center;
  }
  .enter-btn{
    display:inline-block;
    font-family:'Cinzel', serif;
    font-weight:600;
    font-size:0.95rem;
    letter-spacing:1.5px;
    text-transform:uppercase;
    text-decoration:none;
    padding:14px 30px;
    border-radius:6px;
    border:2px solid var(--gold);
    color:var(--gold);
    background:rgba(201,162,75,0.08);
    box-shadow:0 0 16px rgba(201,162,75,0.15);
    transition:background 0.2s ease, box-shadow 0.2s ease;
  }
  .enter-btn:hover{
    background:rgba(201,162,75,0.2);
    box-shadow:0 0 22px rgba(201,162,75,0.35);
  }
  .enter-sub{
    margin-top:10px;
    font-size:0.8rem;
    color:#8a7a5a;
    font-style:italic;
  }
</style>
</head>
<body>

  <!-- CHARACTER SHEET -->
  <div class="card">
    <svg class="corner-rune tl" viewBox="0 0 40 40"><path d="M4 4 L20 4 M4 4 L4 20" stroke="#c9a24b" stroke-width="2" fill="none"/><circle cx="4" cy="4" r="2.5" fill="#c9a24b"/></svg>
    <svg class="corner-rune tr" viewBox="0 0 40 40"><path d="M4 4 L20 4 M4 4 L4 20" stroke="#c9a24b" stroke-width="2" fill="none"/><circle cx="4" cy="4" r="2.5" fill="#c9a24b"/></svg>
    <svg class="corner-rune bl" viewBox="0 0 40 40"><path d="M4 4 L20 4 M4 4 L4 20" stroke="#c9a24b" stroke-width="2" fill="none"/><circle cx="4" cy="4" r="2.5" fill="#c9a24b"/></svg>
    <svg class="corner-rune br" viewBox="0 0 40 40"><path d="M4 4 L20 4 M4 4 L4 20" stroke="#c9a24b" stroke-width="2" fill="none"/><circle cx="4" cy="4" r="2.5" fill="#c9a24b"/></svg>

    <div class="sheet-header">
      <div class="sheet-label">✦ Character Sheet ✦</div>
      <h1 class="char-name fill">Princess Kayleigh Day</h1>
    </div>

    <div class="stat-grid">
      <div class="stat-key">Class</div>
      <div class="stat-val"><span class="badge">Enchantress</span></div>

      <div class="stat-row-divider"></div>

      <div class="stat-key">Alignment</div>
      <div class="stat-val">Questionably Lawful</div>

      <div class="stat-row-divider"></div>

      <div class="stat-key">Special Ability</div>
      <div class="stat-val">Makes Benny ridiculously happy</div>

      <div class="stat-row-divider"></div>

      <div class="stat-key">Passive Ability</div>
      <div class="stat-val"><span class="badge cosy">+10 Cosiness</span> <span class="badge love">+25 Love</span></div>

      <div class="stat-row-divider"></div>

      <div class="stat-key">Weakness</div>
      <div class="stat-val fill">The Hump Stump!</div>

      <div class="stat-row-divider"></div>

      <div class="stat-key">Current Quest</div>
      <div class="stat-val">A Knight in the North</div>
    </div>

    <div class="enter-row">
      <a href="quest_log.html" class="enter-btn">⚔ View Quest Log</a>
      <div class="enter-sub">A new quest awaits...</div>
    </div>
  </div>

</body>
</html>
