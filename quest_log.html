<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Quest Log — The Lavender Lodge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=MedievalSharp&family=Cinzel:wght@400;600;700&family=Cinzel+Decorative:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#c9a24b;
    --gold-dim:#8a6f33;
    --parchment:#ecdcb8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:40px 16px;
    min-height:100vh;
    background:
      radial-gradient(ellipse at 30% 0%, #2a2030 0%, transparent 55%),
      radial-gradient(ellipse at 80% 100%, #1a1620 0%, transparent 55%),
      #151016;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:24px;
    font-family:'MedievalSharp', cursive;
  }

  .back-link{
    align-self:center;
    font-family:'Cinzel', serif;
    font-size:0.78rem;
    letter-spacing:1px;
    text-transform:uppercase;
    color:#8a7a5a;
    text-decoration:none;
    margin-bottom:-6px;
  }
  .back-link:hover{ color:var(--gold); }

  .quest-card{
    width:100%; max-width:640px;
    background: linear-gradient(160deg, #241d16, #2e2419);
    border:2px solid var(--gold);
    border-radius:10px;
    box-shadow:
      0 0 20px rgba(201,162,75,0.15),
      0 0 0 1px rgba(201,162,75,0.4) inset,
      0 20px 45px rgba(0,0,0,0.6);
    padding:30px 32px 34px;
    text-align:center;
    position:relative;
  }
  .quest-unlocked{
    font-family:'Cinzel Decorative', serif;
    font-size:0.95rem;
    letter-spacing:3px;
    color:#e8c96a;
    text-transform:uppercase;
    margin-bottom:6px;
    animation:pulseGlow 2.4s ease-in-out infinite;
  }
  @keyframes pulseGlow{
    0%,100%{ text-shadow:0 0 6px rgba(232,201,106,0.4);}
    50%{ text-shadow:0 0 16px rgba(232,201,106,0.9);}
  }
  .quest-title{
    font-family:'UnifrakturMaguntia', cursive;
    font-size:2.3rem;
    color:var(--parchment);
    margin:4px 0 18px;
  }
  .quest-line{
    font-family:'Cinzel', serif;
    font-size:0.95rem;
    color:var(--parchment);
    margin:6px 0;
    letter-spacing:0.5px;
  }
  .quest-line .key{ color:var(--gold); text-transform:uppercase; letter-spacing:1px; margin-right:6px; }

  .party-track{
    display:flex; justify-content:center; gap:10px; margin:20px 0 22px;
  }
  .party-slot{
    width:34px; height:34px;
    border:2px solid var(--gold-dim);
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:'Cinzel', serif; font-size:0.85rem;
    color:#8a7a5a;
  }
  .party-slot.filled{
    background:var(--gold-dim);
    color:#1a1410;
    border-color:var(--gold);
  }

  .join-prompt{
    font-family:'MedievalSharp', cursive;
    font-size:1.25rem;
    color:var(--parchment);
    margin:14px 0 24px;
  }

  .choice-row{
    display:flex; justify-content:center; gap:22px; flex-wrap:wrap;
  }
  .choice{
    font-family:'Cinzel', serif;
    font-weight:600;
    font-size:0.95rem;
    letter-spacing:1px;
    padding:12px 22px;
    border-radius:6px;
    border:2px solid;
    min-width:220px;
    display:inline-block;
    text-decoration:none;
  }
  .choice.yes{
    border-color:#5aa06a;
    color:#bfe8c6;
    background:rgba(90,160,106,0.08);
  }
  .choice.yes:hover{ background:rgba(90,160,106,0.2); }
  .choice.no{
    border-color:#8a3a3a;
    color:#e8bcbc;
    background:rgba(138,58,58,0.08);
  }
  .choice.no:hover{ background:rgba(138,58,58,0.2); }
  .choice .sub{
    display:block;
    font-family:'MedievalSharp', cursive;
    font-weight:400;
    font-size:0.78rem;
    letter-spacing:0;
    color:#a89a8a;
    margin-top:3px;
  }
</style>
</head>
<body>

  <a href="landing.html" class="back-link">↺ Back to Character Sheet</a>

  <!-- QUEST UNLOCK -->
  <div class="quest-card">
    <div class="quest-unlocked">✦ New Quest Unlocked ✦</div>
    <div class="quest-title">The Lavender Lodge</div>

    <div class="quest-line"><span class="key">Objective</span>Establish a cosy life together in the Highlands</div>
    <div class="quest-line"><span class="key">Required Party Members</span>2</div>
    <div class="quest-line"><span class="key">Current Party</span>1</div>

    <div class="party-track">
      <div class="party-slot filled">1</div>
      <div class="party-slot">2</div>
    </div>

    <div class="join-prompt">Will you join my party?</div>

    <div class="choice-row">
      <a href="quest_accepted.html" class="choice yes">❤️ YES <span class="sub">Become my girlfriend</span></a>
      <a href="quest_failed.html" class="choice no">💀 NO <span class="sub">Face the consequences of making a Paladin sad</span></a>
    </div>
  </div>

</body>
</html>
